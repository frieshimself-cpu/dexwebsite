<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mrBody" x1="14" y1="50" x2="52" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5cd2"/>
      <stop offset="0.3" stop-color="#7c5cff"/>
      <stop offset="0.65" stop-color="#38bdf8"/>
